name: API CI

on:
  pull_request:
    branches: [develop, qa, main]
  push:
    branches: [develop, qa]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Compile
        run: npm run build
      - name: Unit and HTTP tests
        run: npm test
